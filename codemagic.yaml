workflows:
  android-release:
    name: Soat - Android Release
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.redmiclock.app"
      # Haqiqiy keystore ulaganingizdan so'ng quyidagi 2 qatorni oching:
      # android_signing:
      #   - redmi_clock_keystore   # Codemagic UI > Code signing > Android'da qo'shilgan nom bilan BIR XIL bo'lishi shart
      # groups:
      #   - keystore_credentials    # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD shu yerda

    cache:
      cache_paths:
        - ~/.pub-cache
        - $HOME/.gradle/caches

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true

    scripts:
      - name: Flutter paketlarini o'rnatish
        script: |
          flutter packages pub get

      - name: Flutter analyze (ixtiyoriy, xatoliklarni ko'rsatadi)
        script: |
          flutter analyze || true

      - name: Release APK yig'ish
        script: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER

      - name: Release AAB yig'ish (Play Store uchun)
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - your-email@example.com   # o'z emailingizga almashtiring
        notify:
          success: true
          failure: true
      # Play Store'ga avtomatik yuklash kerak bo'lsa, quyidagini oching:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  android-debug:
    name: Soat - Android Debug (tez test uchun)
    max_build_duration: 20
    environment:
      flutter: stable

    cache:
      cache_paths:
        - ~/.pub-cache
        - $HOME/.gradle/caches

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
        - pattern: main
          include: false

    scripts:
      - name: Flutter paketlarini o'rnatish
        script: |
          flutter packages pub get

      - name: Debug APK yig'ish
        script: |
          flutter build apk --debug

    artifacts:
      - build/**/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: false
          failure: true
